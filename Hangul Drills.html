<!doctype html>
<html lang="en"><head>
<meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hangul Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Young+Serif&display=swap">
<style>
:root{--ground:#f4efe4;--dot:rgba(31,27,22,.075);--surface:#fffcf5;--ink:#1f1b16;--muted:#6b6252;--line:#e3d9c6;--chip:#efe7d6;--chip-hover:#e5dac3;--soft:#f8f3e8;--accent:#2d4f9e;--primary:#1f1b16;--primary-hover:#3b342a;--on-primary:#fffcf5;--press:#000;--hero:#27458c;--seal:#2d4f9e;--on-seal:#fff8ec;--grid:rgba(45,79,158,.3);--good:#2f8a5f;--good-bg:#e2f1e6;--good-ink:#22714c;--bad:#c23b2e;--bad-bg:#f9e3dd;--bad-ink:#a8321f;--shadow:rgba(60,40,15,.25);color-scheme:light;
--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.2,.8,.2,1)}
:root[data-theme="dark"]{--ground:#15130f;--dot:rgba(255,245,225,.045);--surface:#211d17;--ink:#f2ecdf;--muted:#a89f8d;--line:#3a342a;--chip:#2b261e;--chip-hover:#373027;--soft:#1b1814;--accent:#9db3f2;--primary:#f2ecdf;--primary-hover:#ffffff;--on-primary:#15130f;--press:#8a8273;--hero:#2b4691;--seal:#9db3f2;--on-seal:#15130f;--grid:rgba(157,179,242,.32);--good:#62cf97;--good-bg:#173526;--good-ink:#6fd8a1;--bad:#f08877;--bad-bg:#3f1d17;--bad-ink:#f39a8a;--shadow:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--ground);transition:background .3s}
body{background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px;font-family:"Schibsted Grotesk",-apple-system,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.ko{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Nanum Gothic",sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes screenIn{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes cardIn{from{opacity:0;transform:translateX(42px) scale(.97) rotate(1deg)}}
@keyframes chIn{0%{opacity:0;transform:translateY(22px) scale(.5) rotate(-10deg)}60%{opacity:1}}
@keyframes optIn{from{opacity:0;transform:translateY(18px) scale(.94)}}
@keyframes out{to{opacity:0;transform:translateX(-40px) scale(.97)}}
@keyframes goodPop{0%{transform:scale(1)}30%{transform:scale(1.07)}60%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px) rotate(-1.5deg)}35%{transform:translateX(8px) rotate(1deg)}55%{transform:translateX(-5px)}75%{transform:translateX(3px)}}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.14,1.3)}}
@keyframes fbIn{0%{opacity:0;transform:translateY(8px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes shimmer{0%{transform:translateX(-120%)}60%,100%{transform:translateX(320%)}}
@keyframes nextIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes heroIn{0%{opacity:0;transform:scale(.88) translateY(12px) rotate(-2deg)}}
@keyframes sweep{0%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(420%) skewX(-18deg)}}
@keyframes flare{0%{box-shadow:0 0 0 0 var(--seal),inset 0 0 0 1.5px var(--seal)}100%{box-shadow:0 0 0 14px transparent,inset 0 0 0 1.5px var(--seal)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.08)}60%{transform:rotate(5deg) scale(1.05)}}
@keyframes streak{0%{opacity:0;transform:scale(.4) rotate(-12deg)}60%{transform:scale(1.15) rotate(4deg)}100%{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-18deg)}60%{opacity:1;transform:scale(.92) rotate(-4deg)}100%{transform:rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.wrap{max-width:480px;margin:0 auto;padding:28px 18px 32px;display:flex;flex-direction:column;gap:22px;min-height:100vh}
.col{display:flex;flex-direction:column}
.foot{margin:auto 0 0;padding-top:16px;border-top:1px dashed var(--line);font-size:13px;line-height:1.55;color:var(--muted);text-align:center;text-wrap:pretty;animation:fade .8s .7s backwards}

/* theme toggle */
.tg{flex:0 0 auto;position:relative;width:62px;height:36px;border-radius:99px;border:1.5px solid var(--line);padding:0;background:#ece0c8;transition:background .4s ease,transform .2s var(--spring)}
.tg:active{transform:scale(.92)}
[data-theme="dark"] .tg{background:#2b261e}
.tg-knob{position:absolute;top:3px;left:3px;width:27px;height:27px;border-radius:50%;background:#fffcf5;color:#d9821c;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(60,40,15,.25);transition:transform .45s cubic-bezier(.5,1.6,.4,1),background .4s ease,color .4s ease}
[data-theme="dark"] .tg-knob{transform:translateX(26px);background:#15130f;color:#f3e2b0}
.tg-ico{overflow:visible;transition:transform .6s cubic-bezier(.5,1.4,.4,1);transform:rotate(90deg)}
[data-theme="dark"] .tg-ico{transform:rotate(-30deg)}
.tg-bite{transition:transform .5s ease;transform:translate(12px,-12px)}
[data-theme="dark"] .tg-bite{transform:translate(5px,-4px)}
.tg-orb{transform-origin:12px 12px;transition:transform .5s ease;transform:scale(.52)}
[data-theme="dark"] .tg-orb{transform:scale(1)}
.tg-rays{transform-origin:12px 12px;transition:opacity .3s ease,transform .5s ease;opacity:1;transform:scale(1) rotate(0deg)}
[data-theme="dark"] .tg-rays{opacity:0;transform:scale(.4) rotate(-45deg)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* menu */
.mhead{display:flex;flex-direction:column;gap:12px;padding:4px 2px 4px}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{display:inline-flex;align-items:center;gap:9px;font-weight:900;font-size:15px;color:var(--seal);letter-spacing:.16em}
.kicker::before{content:"";flex:0 0 auto;width:12px;height:12px;border-radius:2px;background:var(--seal);transform:rotate(45deg)}
h1.big{margin:0;font-family:"Young Serif",Georgia,"Times New Roman",serif;font-size:42px;line-height:1.02;font-weight:400;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:16px;line-height:1.5;text-wrap:pretty}
.decks{display:flex;flex-direction:column;gap:14px}
.deck{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 0 var(--line),0 16px 30px -24px var(--shadow);transition:transform .35s var(--spring),box-shadow .35s var(--out),background .3s}
#deck-flow{border-color:var(--good);box-shadow:0 4px 0 var(--good),0 16px 30px -24px var(--shadow)}
@media (hover:hover){.deck:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--line),0 22px 34px -22px var(--shadow)}
#deck-flow:hover{box-shadow:0 7px 0 var(--good),0 22px 34px -22px var(--shadow)}
.deck:hover .tile{animation:wiggle .6s var(--out)}}
.drow{display:flex;gap:14px;align-items:center}
.tile{flex:0 0 auto;width:62px;height:62px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;letter-spacing:.02em;outline:1.5px solid color-mix(in srgb,currentColor 40%,transparent);outline-offset:-5px}
.dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dinfo h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.dinfo p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums}
.chip.best{font-weight:700;color:var(--good-ink);background:var(--good-bg)}
.dbtns{display:flex;gap:8px}
.bp{flex:1;min-height:48px;background:var(--primary);color:var(--on-primary);border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--press);transition:background .15s,transform .2s var(--spring),box-shadow .15s}
.bp:hover{background:var(--primary-hover)}
.bs{flex:0 0 auto;min-height:48px;background:var(--chip);color:var(--ink);border:0;border-radius:12px;padding:13px 16px;font-weight:600;font-size:15px;box-shadow:0 3px 0 var(--line);transition:background .15s,transform .2s var(--spring),box-shadow .15s}
.bs:hover{background:var(--chip-hover)}
.bp:active,.bs:active,.bsec:active,.next:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.drawer{display:grid;grid-template-rows:0fr;opacity:0;margin-top:-14px;transition:grid-template-rows .4s var(--out),opacity .25s ease,margin-top .4s var(--out)}
.deck.open .drawer{grid-template-rows:1fr;opacity:1;margin-top:0}
.drawer>div{overflow:hidden;min-height:0}
.wl{list-style:none;margin:0;padding:12px 0 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.wl li{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
.deck.open .wl li{animation:optIn .4s var(--spring) backwards;animation-delay:calc(.05s + var(--i)*28ms)}
.wl .h{font-weight:900;font-size:21px;line-height:1.3}
.wl .p{color:var(--accent);font-weight:600;font-size:13px}
.wl .e{color:var(--muted);font-size:13px}
.wl .s{color:var(--ink);font-size:12px;font-style:italic;opacity:.8}

#menu.enter .mhead>*{animation:up .6s var(--out) backwards}
#menu.enter .mhead>*:nth-child(2){animation-delay:.07s}
#menu.enter .mhead>*:nth-child(3){animation-delay:.14s}
#menu.enter .mode{animation:up .6s .2s var(--out) backwards}
#menu.enter .deck{animation:up .65s var(--out) backwards;animation-delay:calc(.26s + var(--i)*60ms)}
#menu.enter .tile{animation:chIn .7s var(--spring) backwards;animation-delay:calc(.36s + var(--i)*60ms)}
#menu.swap .chip.best,#menu.swap .chip.ready{animation:streak .45s var(--out) backwards}
#menu.swap .mode p{animation:fade .35s ease backwards}
#menu.swap .mode.on{animation:flare .7s ease-out}

/* game */
#game.enter{animation:screenIn .5s var(--out) backwards}
.ghead{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px}
.back{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .25s var(--spring)}
.back:hover{background:var(--chip-hover)}
@media (hover:hover){.back:hover{transform:translateX(-2px)}}
.gtitle{margin:0;font-size:16px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;display:inline-block}
.score.bump{animation:bump .45s var(--spring)}
.score.bump.good{color:var(--good-ink);border-color:var(--good)}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .7s var(--spring);width:0;position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 2.6s ease-in-out infinite}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:24px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:240px;justify-content:center;box-shadow:0 4px 0 var(--line),0 20px 36px -26px var(--shadow);animation:cardIn .5s var(--out) backwards;transition:box-shadow .4s,border-color .4s}
.qcard.good{border-color:var(--good);box-shadow:0 4px 0 var(--good),0 20px 36px -26px var(--shadow)}
.qcard.bad{border-color:var(--bad);box-shadow:0 4px 0 var(--bad),0 20px 36px -26px var(--shadow)}
.qlabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.qcard .qlabel{animation:fade .5s .1s backwards}
.qhan{display:flex;justify-content:center;flex-wrap:wrap;padding:4px 0;font-weight:900;font-size:58px;line-height:1}
.qhan .ch{display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;margin-left:-1.5px;border:1.5px solid var(--grid);background:repeating-linear-gradient(90deg,var(--grid) 0 4px,transparent 4px 8px) center/100% 1px no-repeat,repeating-linear-gradient(0deg,var(--grid) 0 4px,transparent 4px 8px) center/1px 100% no-repeat;animation:chIn .6s var(--spring) backwards;animation-delay:calc(.12s + var(--i)*80ms)}
.qhan .ch:first-child{margin-left:0}
.qhan.say .ch{animation:bump .5s var(--spring);animation-delay:calc(var(--i)*90ms)}
.qpin{font-size:21px;color:var(--accent);font-weight:600}
.qsay{font-size:15px;color:var(--muted);font-weight:600}
.qsay b{color:var(--ink);font-weight:700}
.rev{animation:up .45s .3s var(--out) backwards}
.qen{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:38px;line-height:1.12;letter-spacing:-.01em;padding:10px 0;text-wrap:balance}
.qen .wd{display:inline-block;animation:chIn .55s var(--spring) backwards;animation-delay:calc(.12s + var(--i)*60ms)}
.fb{min-height:24px;text-align:center;font-weight:700;font-size:16px;line-height:1.4;text-wrap:pretty}
.fb.good{color:var(--good-ink)} .fb.bad{color:var(--bad-ink)}
.fb>span{display:inline-block;animation:fbIn .4s var(--spring) backwards}
.streak{display:inline-block;margin-left:6px;background:var(--good-bg);border:1px solid var(--good);border-radius:6px;padding:1px 8px;font-size:14px;animation:streak .55s .15s var(--out) backwards}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;min-height:92px;border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .2s var(--spring),background .2s,border-color .2s,box-shadow .2s,opacity .3s;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--ink);animation:optIn .45s var(--spring) backwards;animation-delay:calc(.22s + var(--i)*55ms)}
@media (hover:hover){.opt:not([disabled]):hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 5px 0 var(--accent)}}
.opt:not([disabled]):active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.opt[disabled]{cursor:default}
.opt.good{background:var(--good-bg);border-color:var(--good);box-shadow:0 3px 0 var(--good);animation:goodPop .55s var(--spring)}
.opt.good::after{content:"";position:absolute;inset:-1.5px;border-radius:14px;border:2px solid var(--good);pointer-events:none;animation:ring .65s ease-out forwards}
.opt.good.late,.opt.good.late::after{animation-delay:.25s}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:shake .5s ease}
.opt.dim{opacity:.5;transform:scale(.97)}
.opt .h{font-weight:900;font-size:28px;line-height:1.2}
.opt .p{color:var(--muted);font-size:14px;font-weight:600}
.opt .e{font-weight:700;font-size:17px;line-height:1.25;text-wrap:balance}
.next{min-height:52px;background:var(--primary);color:var(--on-primary);border:0;border-radius:14px;padding:16px;font-weight:700;font-size:17px;width:100%;box-shadow:0 4px 0 var(--press);animation:nextIn .45s var(--spring) backwards;transition:background .15s,transform .2s var(--spring),box-shadow .15s}
.next:hover{background:var(--primary-hover)}
#stage.leave>*{animation:out .22s ease-in forwards!important;pointer-events:none}
#stage.leave>.opts{animation-delay:.03s!important}

/* results */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff8ec;border-radius:18px;padding:32px 22px 30px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:inset 0 0 0 7px var(--hero),inset 0 0 0 8.5px rgba(222,232,255,.55),0 20px 36px -24px var(--shadow);animation:heroIn .6s var(--spring) backwards}
.hero.perfect::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,240,220,.28),transparent);animation:sweep 1.6s .6s ease-in-out 2 backwards}
.hero .qlabel{color:#d6e0ff;animation:fade .5s .2s backwards}
.hero .num{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:72px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.hero .num.done{animation:bump .5s var(--spring)}
.hero .verdict{font-size:16px;color:#eef2ff;max-width:300px;text-wrap:balance;animation:up .5s var(--out) backwards}
.hero .verdict:nth-of-type(2){animation-delay:.9s}
.hero .verdict:nth-of-type(3){animation-delay:1.05s}
.hero .verdict:nth-of-type(4){animation-delay:1.15s}
.hero .verdict:nth-of-type(5){animation-delay:1.25s}
.rv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rv li{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:center;animation:up .45s var(--out) backwards;animation-delay:calc(1.1s + var(--i)*60ms)}
.rv .h{font-weight:900;font-size:26px;grid-row:span 3}
.rv .s{color:var(--ink);font-size:13px;font-style:italic;opacity:.8}
.rv .p{color:var(--accent);font-weight:600;font-size:15px}
.rv .e{color:var(--muted);font-size:14px}
.revhead{animation:fade .4s 1s backwards}
.results-btn{animation:nextIn .5s var(--spring) backwards;animation-delay:calc(1.2s + var(--n,0)*60ms)}
.bsec{min-height:50px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:600;font-size:16px;box-shadow:0 3px 0 var(--line);transition:background .15s,transform .2s var(--spring),box-shadow .15s}
.bsec:hover{background:var(--chip-hover)}

/* hard mode */
.mode{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;transition:background .3s,border-color .3s}
.mode.on{border-color:var(--seal);box-shadow:inset 0 0 0 1.5px var(--seal)}
.mode h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
.mode.on h2::after{content:"급";font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-weight:900;font-size:14px;width:24px;height:24px;border-radius:4px;background:var(--seal);color:var(--on-seal);display:inline-flex;align-items:center;justify-content:center;transform:rotate(-6deg);animation:stamp .45s var(--out) backwards}
.mode p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.4;text-wrap:pretty}
.sync{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sync h2{margin:0;font-size:17px;font-weight:700}
.sync p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.4;text-wrap:pretty}
.sync .dbtns .bs{flex:1}
.sync textarea{font:inherit;font-size:14px;line-height:1.45;width:100%;min-height:110px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);resize:vertical;outline:0}
.sync textarea:focus{border-color:var(--accent)}
#repout{min-height:220px}
#syncbox{display:flex;flex-direction:column;gap:8px}
#syncbox:empty{display:none}
.sync p.smsg{font-size:14px;font-weight:600}
.sync p.smsg.good{color:var(--good-ink)}
.sync p.smsg.bad{color:var(--bad-ink)}
.sw{flex:0 0 auto;width:56px;height:34px;border-radius:99px;border:0;padding:0;background:var(--chip-hover);box-shadow:inset 0 0 0 1.5px var(--line);position:relative;transition:background .3s ease,transform .25s var(--spring)}
.sw:active{transform:scale(.94)}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fffcf5;box-shadow:0 2px 0 rgba(40,25,10,.25);transition:transform .45s cubic-bezier(.5,1.6,.4,1),width .2s ease}

/* ---------------- lessons ----------------
   the tutor hands over a lesson code at the end of each lesson. it's cumulative (everything taught so far), so a skipped
   paste costs nothing: the next one catches up. format, whitespace-tolerant:
     HD1|<date>|<skills taught, space-separated>|<word=meaning;word=meaning…>|<look-alike pairs from the lesson notes>|#<checksum>
   once a code is in, new letters only unlock when a lesson has taught them (push mode overrides), lesson words jump the queue
   and skip the daily cap, and lesson words that aren't in the bank get added. pairs only re-heat when the code is newer. */
const ck=s=>{let h=7;for(const c of s)h=(h*31+c.codePointAt(0))%65521;return h.toString(16).padStart(4,"0")};
function parseCode(raw){
  const s=String(raw).replace(/\s+/g," ").replace(/\s*([|;=#])\s*/g,"$1").trim(),at=s.lastIndexOf("|#");
  if(!/^HD1\|/.test(s))return{err:"that doesn't look like a lesson code. it should start with HD1|"};
  if(at<0||ck(s.slice(0,at))!==s.slice(at+2).toLowerCase())return{err:"the code got cut off or changed while copying. copy the whole thing again"};
  const [,d,L,W,P]=s.slice(0,at).split("|");
  const words=(W||"").split(";").filter(Boolean).map(x=>{const i=x.indexOf("=");return i<0?[x,""]:[x.slice(0,i),x.slice(i+1)]}).filter(([h])=>[...h].every(c=>decomp(c)));
  return{d,L:(L||"").split(" ").filter(k=>ORDER.includes(k)),W:words,P:(P||"").split(" ").filter(p=>[...p].length===2).map(p=>pkey(...p))};
}

function grade(k,ok){
  const m=M[k];if(!m)return;
  if(!(k in S.b0))S.b0[k]=m.b;
  const now=Date.now();m.n++;m.t=now;
  if(ok){m.r++;if(now>=m.d||m.b<1){m.b=Math.min(MAXB,m.b+1);m.d=now+IV[m.b]}}

  if(BY.has(k))["m","p"].forEach(f=>M[fk(k,f)]={b:0,d:now,n:0,r:0,t:now,i:META.seq});
  if(!BY.has(k)){if(META.day!==dayStr()){META.day=dayStr();META.n=0}META.n++}

/* ---------------- confetti ---------------- */
let raf=null,cv=null;
function stopConfetti(){if(raf)cancelAnimationFrame(raf);raf=null;if(cv)cv.remove();cv=null}
function confetti(ratio){
  if(RM())return;
  stopConfetti();
  const N=ratio===1?110:ratio>=.5?70:40, dpr=Math.min(window.devicePixelRatio||1,1.5), W=innerWidth, H=innerHeight;
  cv=document.createElement("canvas");cv.width=W*dpr;cv.height=H*dpr;
  cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50";
  document.body.appendChild(cv);
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const cols=["#f0a020","#e2553a","#1f8a5b","#16607f","#6cbde0","#3c4aa3","#f3e7b0"], ps=[];
  for(let i=0;i<N;i++){const left=i%2===0,a=(left?-60:-120)*Math.PI/180+(Math.random()-.5)*.9,v=9+Math.random()*7;
    ps.push({x:left?-10:W+10,y:H*.55,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*5,h:4+Math.random()*4,rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[i%cols.length],t:Math.random()*6.28})}
  const t0=performance.now(),DUR=3200;
  const step=now=>{
    const el=now-t0;ctx.clearRect(0,0,W,H);
    ctx.globalAlpha=el>DUR-700?Math.max(0,(DUR-el)/700):1;
    for(const p of ps){p.vy+=.28;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.t+=.12;if(p.y>H+20)continue;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.cos(p.t));ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    if(el<DUR)raf=requestAnimationFrame(step);else stopConfetti();
  };
  raf=requestAnimationFrame(step);
}

let LOG=json("hangul_log",[]);

const fmtD=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
/* plain text for the tutor. covers everything since the last lesson code went in (or the last 7 days before the first one) */
function reportText(){
  const now=Date.now(),since=LES?LES.at:now-7*DAY,L=LOG.filter(e=>e.t>since),out=[];
  out.push(`Hangul Drills report, ${fmtD(now)} (${LES?`since the lesson code from ${LES.d}`:"last 7 days, no lesson code yet"})`);
  if(!L.length)out.push("no practice in that time");
  else{const right=L.filter(e=>e.ok).length;out.push(`practice: ${plural(new Set(L.map(e=>fmtD(e.t))).size,"day")}, ${L.length} answers, ${Math.round(right/L.length*100)}% right first time`)}
  /* look-alikes: mix-ups caught anywhere, plus how the head-to-head drills went */
  const mx={},dr={};
  L.forEach(e=>{(e.x||[]).forEach(k=>mx[k]=(mx[k]||0)+1);if(e.p){const d=dr[e.p]||(dr[e.p]={n:0,r:0});d.n++;if(e.ok)d.r++}});
  const pk=[...new Set([...Object.keys(mx),...Object.keys(dr)])].sort((a,b)=>(mx[b]||0)-(mx[a]||0));
  if(pk.length)out.push("look-alikes: "+pk.map(k=>`${[...k].join("/")} mixed up ${mx[k]||0}x${dr[k]?`, drills ${dr[k].r}/${dr[k].n} right`:""}${CONF[k]&&CONF[k].s<3?" (still drilling)":" (cleared)"}`).join("; "));
  /* words, split by what was being tested */
  const fw={r:{},m:{},p:{}};
  L.filter(e=>e.w&&FACET[e.q]).forEach(e=>{const g=fw[FACET[e.q]],c=g[e.h]||(g[e.h]={n:0,x:0});c.n++;if(!e.ok)c.x++});
  const wl=(g,lab)=>{const a=Object.entries(g).filter(([,c])=>c.x).sort((a,b)=>b[1].x-a[1].x||b[1].n-a[1].n).slice(0,8);
    if(a.length)out.push(`${lab}: `+a.map(([h,c])=>`${h} (${BY.get(h)?.e||"?"}) ${c.x} of ${c.n} wrong`).join(", "))};
  wl(fw.m,"meanings missed");wl(fw.p,"writing from English missed");wl(fw.r,"reading missed");
  const lc={};L.forEach(e=>(e.b||[]).forEach(k=>lc[k]=(lc[k]||0)+1));
  const ls=Object.entries(lc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(ls.length)out.push("letters blamed most: "+ls.map(([k,n])=>`${glyph(k)}${isF(k)?" (bottom)":""} ${n}x`).join(", "));
  /* only memories that have actually been tested count, so the low starting boxes from the three-way split don't show up as weak */
  const low=h=>FACETS.filter(f=>{const m=M[fk(h,f)];return m&&m.n>0&&m.b<=1});
  const weak=knownWords().filter(w=>low(w.h).length).sort((a,b)=>low(b.h).length-low(a.h).length).slice(0,8);
  if(weak.length)out.push("weakest words right now: "+weak.map(w=>`${w.h} (${low(w.h).map(f=>({r:"reading",m:"meaning",p:"writing"})[f]).join("+")})`).join(", "));
  if(LES){
    const ahead=ORDER.filter(k=>M[k]&&!LES.L.includes(k)&&!NF.has(k)),pend=LES.L.filter(k=>!M[k]),notYet=LES.W.filter(([h])=>!M[h]).map(([h])=>h);
    if(ahead.length)out.push("app unlocked before a lesson taught them: "+ahead.map(glyph).join(" "));
    if(pend.length)out.push("taught but not unlocked in the app yet: "+pend.map(glyph).join(" "));
    if(notYet.length)out.push(`lesson words the app hasn't reached yet (${notYet.length}): `+notYet.slice(0,12).join(" ")+(notYet.length>12?" …":""));
  }
  out.push(`totals: ${ORDER.filter(k=>M[k]).length} letter skills, ${knownWords().length} words`);
  return out.join("\n");
}

    /* a real word is cued by its English only (that's the writing-from-memory skill), except in Build mode, which is sounds → hangul */
    build:w?`<div class="col" style="align-items:center;gap:6px">${big(w.e)}${S.mode.force==="build"?`<div class="qsay">${esc(dot)}</div>`:`<div class="qpin rev" hidden>${esc(dot)}</div>`}<div class="rev" hidden>${hangul}</div></div>`
      :`<div class="col" style="align-items:center;gap:6px">${big(R.r)}<div class="rev" hidden>${hangul}</div></div>`,
    write:`<div class="col" style="align-items:center;gap:6px">${big(w?w.e:"")}<div class="qpin rev" hidden>${esc(dot)}</div><div class="rev" hidden>${hangul}</div></div>`,
    recall:`<div class="col" style="align-items:center;gap:6px">${hangul}<div class="qpin rev" hidden>${esc(dot)}</div></div>`,
    spot:`<div class="col" style="align-items:center;gap:6px">${big(R.r)}${w?`<div class="qsay rev" hidden>means <b>${esc(w.e)}</b></div>`:""}</div>`,
    word:`<div class="col" style="align-items:center;gap:6px">${big(w?w.e:"")}<div class="qpin rev" hidden>${esc(dot)}</div></div>`,
    pair:`<div class="col" style="align-items:center;gap:6px">${w?big(w.e):big(R.r)}${w?`<div class="qpin rev" hidden>${esc(dot)}</div>`:""}</div>`
  }[q.t];
  const opt=c=>q.t==="sound"?`<span class="tp">${esc(romanize(c.h).r)}</span>`
    :q.t==="mean"?`<span class="e">${esc(c.w.e)}</span>`
    :`<span class="h ko">${esc(c.h)}</span><span class="p rev" hidden>${esc(romanize(c.h).r)}</span>`;
  const answers=q.t==="read"
    ?`<form class="typer" novalidate>
        <input id="ty" class="tyin" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" placeholder="type the sounds" aria-label="Romanization of ${esc(q.h)}">
        <div class="typrev" id="typrev" aria-live="polite"></div>
        <div class="tybtns"><button type="submit" class="bp">Check</button><button type="button" class="bs" data-act="giveup">Show me</button></div>
        <p class="tyhint">one block at a time, left to right: <b>나무</b> → na·mu → namu</p>
      </form>`
    :q.t==="build"
    ?`<div class="typer">
        <div class="qhan ko built" id="built" aria-live="polite"></div>
        <div class="tiles">${tilesFor(q.h).map(j=>`<button class="tk ko" data-act="tile" data-j="${j}">${j}</button>`).join("")}</div>
        <div class="tybtns"><button class="bp" data-act="check">Check</button><button class="bs" data-act="del" aria-label="Delete the last letter">⌫</button><button class="bs" data-act="giveup">Show me</button></div>
      </div>`
    :q.t==="write"
    ?`<div class="typer">
        <div class="qhan ko built" id="built" aria-live="polite"></div>
        <div class="kb" id="kb"></div>
        <div class="tybtns"><button class="bp" data-act="check">Check</button><button class="bs" data-act="del" aria-label="Delete the last letter">⌫</button><button class="bs" data-act="giveup">Show me</button></div>
      </div>`
    :q.t==="recall"
    ?`<div class="typer">
        <div class="qsay rcm" id="rcm" hidden>means <b>${esc(w.e)}</b></div>
        <div class="tybtns" id="rcb"><button class="bp" data-act="reveal">Show meaning</button></div>
      </div>`
    :`<div class="opts">${S.choices.map((c,i)=>`<button class="opt" data-act="pick" data-i="${i}" style="--i:${i}" aria-keyshortcuts="${i+1}">${opt(c)}</button>`).join("")}</div>`;
  $("stage").innerHTML=`
    <div class="qcard"><span class="qlabel">${label}</span>${card}</div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    ${answers}
    <div id="nextWrap"></div>`;
  if(q.t==="build"||q.t==="write")renderBuilt();
  if(q.t==="write")renderKB();
  if(q.t==="recall")setTimeout(()=>{try{$("rcb").firstChild.focus({preventScroll:true})}catch(e){}},RM()?0:300);
  if(q.t==="read")setTimeout(()=>{try{$("ty").focus({preventScroll:true})}catch(e){}},RM()?0:300);
}
/* typed romanization. right = matches the official spelling. also counted, with a note: the letter-by-letter spelling of a word
   that has a sound change, and k/t/p/ch standing in for g/d/b/j while the airy letters haven't been introduced yet. */
function checkRead(val,h){
  const R=romanize(h),P=romanize(h,true),a=nrm(val),said=R.parts.join("·");
  if(a===nrm(R.r))return{ok:true};
  if(R.chg&&a===nrm(P.r))return{ok:true,note:`counted. said out loud it's ${said}`};
  const close=lax(val)===lax(R.r)||(R.chg&&lax(val)===lax(P.r));
  if(close&&!AIR.some(k=>M[k]))return{ok:true,note:`counted, but the official spelling is ${said}`};
  const bad=blame(R.toks,a);
  return{ok:false,bad,sw:close?[]:bad.sw,note:close?"so close, mind g/k, d/t, b/p and j/ch":""};
}
function submitTyped(giveUp){
  const q=S.cur;if(S.picked||leaving||!q||q.t!=="read")return;
  const inp=$("ty"),val=giveUp?"":inp.value.trim();
  if(!giveUp&&!nrm(val)){restart(inp,"nudge");inp.focus();return}
  const res=giveUp?{ok:false,bad:[]}:checkRead(val,q.h);
  inp.disabled=true;inp.classList.add(res.ok?"good":"bad");
  document.querySelectorAll(".tybtns,.tyhint").forEach(e=>e.hidden=true);
  if(!giveUp&&!res.ok)$("typrev").innerHTML=`you typed <s>${esc(val)}</s>`;
  resolve(res.ok,{note:res.note||"",el:inp,bad:res.bad||[],sw:res.sw||[]});
}
/* built hangul. a real word has to be spelled exactly. a made-up one just has to sound right, since ㅐ/ㅔ-style twins can't be told apart by ear. */
function submitBuilt(giveUp){
  const q=S.cur;if(S.picked||leaving||!q||(q.t!=="build"&&q.t!=="write"))return;
  const got=compose(S.seq),el=$("built");
  if(!giveUp&&!got){restart(el,"nudge");return}
  const same=romanize(got).r===romanize(q.h).r,ok=!giveUp&&(got===q.h||(!q.w&&same));
  el.classList.add(ok?"good":"bad");
  document.querySelectorAll(".typer .tybtns").forEach(e=>e.hidden=true);
  if(!ok&&!giveUp)el.insertAdjacentHTML("afterend",`<div class="typrev">you wrote <s class="ko">${esc(got)}</s></div>`);
  resolve(ok,{el,note:!ok&&!giveUp&&same?"it sounds right, but that's not how it's spelled":"",bad:giveUp?[]:diffSk(q.h,got),sw:giveUp||same?[]:swaps(q.h,got)});
}
function pick1(i){
  const q=S.cur;if(S.picked||leaving||!q||!S.choices.length)return;
  const c=S.choices[i];if(!c)return;
  const wrongH=c.ok||q.t==="mean"?null:c.h;
  resolve(c.ok,{i,bad:wrongH?diffSk(q.h,wrongH):[],sw:wrongH&&q.t!=="pair"?swaps(q.h,wrongH):[]});
}
/* shared outcome for every question type: scoring, memory, feedback */
function resolve(ok,{i=-1,note="",el=null,bad=[],sw=[]}={}){
  const q=S.cur,w=q.w?BY.get(q.w):null,fa=w&&FACET[q.t],dot=dotted(q.h);S.picked={ok};
  /* a brand-new word joins the pool the moment it's been decoded, and comes back twice: for its meaning, then to be built */
  if(q.fresh&&!M[q.h]){introduce(q.h);S.queue.push({at:S.count+3,q:{t:"mean",h:q.h,w:q.h}},{at:S.count+7,q:{t:"build",h:q.h,w:q.h}})}
  if(q.cb){S.cbTotal++;if(ok)S.cbRight++}
  else{
    S.done++;if(ok)S.right++;S.acc.push(ok);if(S.acc.length>8)S.acc.shift();
    /* meaning questions don't test letters, so they leave the letter records alone */
    if(ok){if(fa!=="m")need(q.h).forEach(k=>grade(k,true));if(fa)grade(fk(w.h,fa),true)}
    else{
      /* only the letters that were actually wrong take the hit, two at most, so one slip can't knock down a whole word's worth */
      const b=[...new Set(bad)].filter(k=>M[k]&&!NF.has(k)).slice(0,2);
      if(!b.length&&q.f&&!w)b.push(q.f);
      b.forEach(k=>grade(k,false));if(fa)grade(fk(w.h,fa),false);
    }
    saveM();tickDay();
  }
  if(q.t==="pair")pairResult(q.pr,ok);
  const mix=ok?[]:sw.filter(([e,g])=>e!==g&&M[e]&&M[g]);
  logAns({t:Date.now(),h:q.h,q:q.t,ok,w:w?1:0,b:ok?[]:[...new Set(bad)].filter(k=>M[k]&&!NF.has(k)).slice(0,2),x:mix.map(([e,g])=>pkey(e,g)),p:q.pr});
  if(mix.length){logConf(mix);if(!note)note=`mixed up ${mix.slice(0,2).map(([e,g])=>`${e} and ${g}`).join(", ")}`}
  let back=false;
  if(ok){S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak)}
  else{
    S.streak=0;if(!S.missed.includes(q.h))S.missed.push(q.h);
    /* a miss comes back a few questions later. a word comes back testing the same memory (another way where there is one);
       made-up syllables come back the other way round */
    const CB=w?{read:"spot",spot:"read",mean:"recall",recall:"mean",word:"build",build:"build",write:"write",pair:"pair"}:{read:"build",build:"read",spot:"sound",sound:"spot",pair:"pair"};
    if((q.tries||0)<2){back=true;S.queue.push({at:S.count+3+Math.floor(Math.random()*3),q:{t:CB[q.t]||"read",h:q.h,w:q.w,f:q.f,alt:q.alt,pr:q.pr,cb:true,tries:(q.tries||0)+1}})}
  }
  document.querySelectorAll(".rev").forEach(r=>r.hidden=false);
  let goodEl=el&&ok?el:null;
  document.querySelectorAll(".opt").forEach((b,j)=>{
    const cj=S.choices[j];b.disabled=true;
    if(cj.ok){b.classList.add("good");if(!ok)b.classList.add("late");goodEl=b}else if(j===i)b.classList.add("bad");else b.classList.add("dim");
  });
  document.querySelectorAll(".tk").forEach(b=>b.disabled=true);
  document.querySelector(".qcard").classList.add(ok?"good":"bad");
  if(ok&&goodEl)burst(goodEl);
  const fb=$("fb");
  fb.className="fb "+(ok?"good":"bad");
  const ans=`${q.h} = ${dot}${w?` (${w.e})`:""}`;
  fb.innerHTML=ok?`<span>${esc(pick(CHEER))}${note?esc(" · "+note):""}${q.fresh?esc(` · that's a real word: ${w.e}`):""}${q.cb?" · cleared":""}${S.streak>=3?`<span class="streak">${S.streak} in a row</span>`:""}</span>`
    :`<span>${esc(`아니에요 — ${note?note+". ":""}it's ${ans}${back?". it'll come back soon":""}`)}</span>`;
  const sc=$("score");sc.textContent=`${S.right} / ${S.done}`;sc.classList.toggle("good",ok);restart(sc,"bump");
  $("bar").style.width=(S.done/ROUND*100)+"%";
  $("nextWrap").innerHTML=`<button class="next" data-act="next">${S.done>=ROUND?"See results":"Next"}</button>`;
  try{$("nextWrap").firstChild.focus({preventScroll:true})}catch(e){}
}
let leaving=false;
function next(){
  if(leaving||!S.picked)return;
  const go=()=>{leaving=false;$("stage").classList.remove("leave");advance()};
  if(RM()){go();return}
  leaving=true;$("stage").classList.add("leave");setTimeout(go,230);
}
function countUp(el,to,total){
  if(RM()||to===0){el.textContent=`${to} / ${total}`;el.classList.add("done");return}
  const t0=performance.now(),D=Math.min(1200,400+to*40);
  const f=now=>{const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);el.textContent=`${Math.round(to*e)} / ${total}`;
    if(p<1)requestAnimationFrame(f);else el.classList.add("done")};
  el.textContent=`0 / ${total}`;setTimeout(()=>requestAnimationFrame(f),250);
}
function finish(){
  const total=S.done,r=total?S.right/total:0;
  const up=Object.keys(S.b0).filter(k=>M[k]&&M[k].b>S.b0[k]).length;
  $("bar").style.width="100%";$("score").textContent=`${S.right} / ${total}`;
  const verdict=r===1?"완벽해요! perfect round, the ribbon seals salute you":r>=.8?"잘했어요! really solid":r>=.5?"좋아요, getting there":"화이팅! keep going, run it again";
  const lines=[verdict,`best streak: ${S.bestStreak}`];
  if(S.fresh.length)lines.push(`new this round: ${S.fresh.map(glyph).join(" · ")}`);
  if(up)lines.push(`${plural(up,"thing")} leveled up`);
  if(S.cbTotal)lines.push(`comebacks cleared: ${S.cbRight} / ${S.cbTotal}`);
  const n=Math.min(S.missed.length,12);
  $("stage").innerHTML=`
    <div class="hero${r===1?" perfect":""}"><span class="qlabel">First-try score</span><div class="num" id="num">${S.right} / ${total}</div>${lines.map(l=>`<span class="verdict">${esc(l)}</span>`).join("")}</div>
    ${n?`<div class="col" style="gap:8px"><p class="qlabel revhead" style="margin:6px 2px 0">Worth another look</p><ul class="rv">${S.missed.map((h,i)=>{const w=BY.get(h);return `<li style="--i:${Math.min(i,12)}"><span class="h ko">${esc(h)}</span><span class="p">${esc(dotted(h))}</span><span class="e">${esc(w?w.e:"practice sounds")}</span></li>`}).join("")}</ul></div>`:""}
    <button class="next results-btn" data-act="again" style="--n:${n}">Keep going</button>
    <button class="bsec results-btn" data-act="menu" style="--n:${n+1}">Back to menu</button>`;
  S.picked=null;
  countUp($("num"),S.right,total);
  window.scrollTo(0,0);setTimeout(()=>confetti(r),RM()?0:500);
}
function toMenu(){stopConfetti();leaving=false;$("game").hidden=true;$("game").innerHTML="";$("menu").hidden=false;renderMenu("enter");window.scrollTo(0,0)}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="theme")toggleTheme(b);
  else if(a==="play")start(b.dataset.id);
  else if(a==="list")toggleList(b.dataset.id,b);
  else if(a==="pick")pick1(+b.dataset.i);
  else if(a==="tile")tapJ(b.dataset.j);
  else if(a==="shift"){if(!S.picked){S.shift=!S.shift;renderKB()}}
  else if(a==="del"){if(!S.picked){S.seq.pop();renderBuilt()}}
  else if(a==="check")submitBuilt(false);
  else if(a==="giveup"){if(S.cur&&(S.cur.t==="build"||S.cur.t==="write"))submitBuilt(true);else submitTyped(true)}
  else if(a==="reveal")revealMeaning();
  else if(a==="self")selfGrade(b.dataset.ok==="1");
  else if(a==="next")next();
  else if(a==="again")start(S.mode.id,true);
  else if(a==="menu")toMenu();
  else if(a==="push")togglePush();
  else if(a==="code"||a==="report")openSync(a);
  else if(a==="import")importCode();
  else if(a==="copyrep")copyReport();
});
document.addEventListener("submit",e=>{if(e.target.closest(".typer")){e.preventDefault();submitTyped(false)}});
/* keyboard: 1-4 answer, enter check / next, backspace undo a letter, esc menu */
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||$("game").hidden||!S.cur)return;
  if(e.target.tagName==="INPUT"){if(e.key==="Escape")e.target.blur();return}
  const k=e.key.toLowerCase(),onBtn=!!e.target.closest?.("button"),building=(S.cur.t==="build"||S.cur.t==="write")&&!S.picked,recall=S.cur.t==="recall"&&!S.picked;
  if(S.cur.t==="write"&&!S.picked&&QW[e.code]){e.preventDefault();const j=QW[e.code];tapJ(e.shiftKey&&SHIFT[j]?SHIFT[j]:j)}
  else if(recall&&!S.revealed&&(k==="enter"||k===" ")){e.preventDefault();revealMeaning()}
  else if(recall&&S.revealed&&(k==="1"||k==="2")){e.preventDefault();selfGrade(k==="1")}
  else if(/^[1-4]$/.test(k)&&!S.picked){e.preventDefault();pick1(+k-1)}
  else if(building&&k==="backspace"){e.preventDefault();S.seq.pop();renderBuilt()}
  else if(building&&k==="enter"&&!onBtn){e.preventDefault();submitBuilt(false)}
  else if((k==="enter"||k===" ")&&!onBtn&&S.picked&&$("nextWrap")?.firstChild){e.preventDefault();next()}
  else if(k==="escape")toMenu();
});
applyTheme();renderMenu("enter");
</script>
</body></html>
